.sb.g{color:var(--ok);border-color:var(--ok);background:rgba(46,204,113,.12)}.sb.o{color:var(--wr);border-color:var(--wr);background:rgba(245,158,11,.12)}.sb.r{color:var(--er);border-color:var(--er);background:rgba(236,13,31,.12)}

.hd .hi b{letter-spacing:.2em}
.ab .rw,.pc .rw{flex-wrap:wrap}.so{font-size:16px}

@keyframes skw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}@keyframes sr1{from{opacity:0;transform:translate(46px,-34px)}to{opacity:1;transform:none}}@keyframes sr2{from{opacity:0;transform:translate(-46px,34px)}to{opacity:1;transform:none}}@keyframes swi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.qe{text-align:center;padding:48px 20px;color:var(--m)}.qei{font-size:38px;width:84px;height:84px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:rgba(236,13,31,.1);border:1px solid rgba(236,13,31,.3)}.qe b{display:block;color:var(--t,#fff);font-size:16px;margin-bottom:4px}
.qr{display:flex;align-items:center;gap:12px;background:var(--c);border:1px solid var(--c2);border-radius:16px;padding:10px 12px;margin-bottom:8px}.qi{flex:1;min-width:0}.qi b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qi small{color:var(--m)}.qn{display:flex;gap:5px;margin-top:5px}.qn span{background:var(--bg);border:1px solid var(--c2);border-radius:8px;padding:2px 8px;font-size:11px}.qb{display:flex;flex-direction:column;gap:6px}.qbt{border:1px solid var(--c2);background:var(--bg);color:inherit;border-radius:10px;padding:7px 11px;font-size:12px;font-weight:700}.qbt.rd{background:#ec0d1f;border-color:#ec0d1f;color:#fff}.cmp .nt{padding:7px 10px;margin-bottom:6px}.cmp .nr{padding:8px 14px}.cmp .cc{padding:10px 14px}.cmp .li{padding:6px 0}.cmp .qr{padding:6px 10px}html.hc[data-theme=dark]{--m:#d6d6dc;--c2:#3e3e46}html.hc[data-theme=light]{--m:#2b2b30;--c2:#a9a9b0}
.nv{position:relative;width:46px;height:46px;border-radius:12px;background:var(--c);border:1px solid var(--c2);display:grid;place-items:center;flex:none}
:root[data-theme=light] .nv{background:#16090b}
.nv .lgm{width:32px;height:28px;filter:none}.nti .lgm{width:48px;height:38px}
.ntr{display:flex;align-items:center;justify-content:space-between;gap:8px}.ntr .sb{flex:none}.ntr h3{flex:1;min-width:0}
.nt .cdn{font-size:11px}.nt small .cdn{color:#ff2433}
.nt{background:var(--c);border-color:var(--c2);color:var(--t)}.nt:active{background:var(--c2)}.nt .ntp{background:var(--c2)}.nti{background-color:#16090b}
.ntl2 span:last-child{color:var(--m)}
/* ===== NEXAR v3: yangi dizayn va animatsiyalar ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
@keyframes pulsey{0%,100%{box-shadow:0 0 0 0 rgba(245,179,1,.6)}50%{box-shadow:0 0 0 6px rgba(245,179,1,0)}}
@keyframes pulseg{0%,100%{box-shadow:0 0 0 0 rgba(46,204,113,.5)}50%{box-shadow:0 0 0 6px rgba(46,204,113,0)}}
@keyframes grow{from{width:0}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes bob{0%{transform:translateY(0)}40%{transform:translateY(-5px) scale(1.12)}100%{transform:none}}
@keyframes sweep{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes arrow{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}

/* sahifa ochilishi */
.pgin>*{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.pgin .stg>*{animation:rise .46s var(--ease) both;animation-delay:calc(var(--i,0)*42ms + 140ms)}
.pgin .ntp i{animation:grow 1s var(--ease) .3s both}

/* umumiy sezgi */
.bt,.cd,.nt,.ac,.pt,.pl,.cc,.qr,.cr,.sx,.ar,.od,.q div,.ib,.nr,.qbt{transition:transform .16s var(--ease),border-color .2s,background .2s,opacity .2s}
.bt:active,.cd:active,.nt:active,.pt:active,.pl:active,.cr:active,.sx:active,.ar:active,.q div:active,.ib:active,.qbt:active{transform:scale(.97)}
.bt.pr{position:relative;overflow:hidden}
.bt.pr:not(:disabled):after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.24) 50%,transparent 70%);transform:translateX(-130%);animation:sweep 3.6s ease-in-out infinite;pointer-events:none}
.sec{display:flex;align-items:center;font-size:12px;margin:24px 0 10px}
.sec:before{content:"";width:3px;height:13px;background:var(--a2);border-radius:2px;margin-right:9px;flex:none}
h1{font-size:27px;letter-spacing:-.01em}
.nav button{transition:background .25s,color .25s}
.nav button.on span{animation:bob .5s var(--ease)}
#md.on{animation:fadein .2s ease-out}
.bx{animation:pop .26s var(--ease)}
#md.sheet .bx.sh{animation:sheetup .34s var(--ease)}
#ts{animation:pop .24s var(--ease)}
.d.y{animation:pulsey 1.7s infinite}
.d.g{animation:pulseg 2.4s infinite}
.sb.o{animation:pulsey 2s infinite}
.sk{height:86px;border-radius:16px;margin-bottom:10px;background:linear-gradient(90deg,var(--c) 25%,var(--c2) 50%,var(--c) 75%);background-size:200% 100%;animation:shine 1.3s linear infinite}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* 1) Turnir turlari: keng qatorlar (kvadrat emas) */
.cl{display:grid;gap:10px;margin-bottom:14px}
.cr{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--c);border:1px solid var(--c2);border-radius:16px;cursor:pointer}
.cr .ic{width:48px;height:48px;font-size:26px}
.cr>div{flex:1;min-width:0}
.cr h3{margin:0 0 2px;font-size:16px;letter-spacing:.05em}
.cr small{color:var(--m)}
.cr em{font-style:normal;font-size:26px;color:var(--m);line-height:1}
